<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23101828'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%232FD6C3' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF8A3D'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="var(--teal)" stroke-width="2.5" opacity=".45"/>
        <circle cx="20" cy="20" r="11" fill="none" stroke="var(--teal)" stroke-width="2.5"/>
        <path d="M20 20 34 8" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="4.5" fill="var(--coral)"/>
      </svg>
      <span>Radar Studio</span>
    </a>
    <label class="account-picker" id="account-picker" hidden><span>Cuenta</span>
      <select aria-label="Cuenta de TikTok: muestra solo sus series, trabajos y videos"></select></label>
    <nav class="tabs" aria-label="Secciones">
      <a href="#/radar" data-nav="radar">Radar</a>
      <a href="#/" data-nav="studio">Estudio</a>
      <a href="#/series" data-nav="series">Series</a>
      <a href="#/biblioteca" data-nav="library">Biblioteca</a>
      <a href="#/sistema" data-nav="system">Sistema</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"></main>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal">
    <form method="dialog" class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" aria-label="Cerrar">✕</button>
    </form>
    <div id="modal-body"></div>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
